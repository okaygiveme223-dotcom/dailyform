{% extends 'registration/base.html' %}
{% block title %}Change password · Dailyform{% endblock %}
{% block content %}
  <h2>Change password</h2>
  <p>Enter your current password and choose a new one.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Save password</button>
  </form>
  <p class="auth-footer"><a href="{% url 'dashboard' %}">Return to dashboard</a></p>
{% endblock %}
