services:
  - type: web
    name: dailyform
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dailyform-db
          property: connectionString
databases:
  - name: dailyform-db
    region: singapore
    plan: free
    databaseName: dailyform
    user: dailyform
    ipAllowList: []
